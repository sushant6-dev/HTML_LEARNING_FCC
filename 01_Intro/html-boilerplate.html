What is the HTML boilerplate, you ask? It's like a ready-made template for your webpages. 
Think of it as the foundation of a house. 
A boilerplate includes the basic structure and essential elements every HTML document needs. 
It saves you time and helps ensure your pages are set up properly. Here is an example:
-->

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
  </body>
</html>
